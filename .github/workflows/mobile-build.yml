name: Mobile CI/CD - Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Expo y EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 4. Instalar dependencias de la app
        run: npm ci

      - name: 5. Compilar APK en la nube (EAS Cloud)
        run: eas build --platform android --profile preview --non-interactive